<!-- SERVIÇOS: o que eu construo, em tipografia, com orçamento sob consulta -->
<section class="servicos" id="servicos" data-secao="servicos">
  <div class="servicos__topo" data-revela>
    <h2 class="titulo">
      <span class="linha"><span>O que eu</span></span>
      <span class="linha"><span>construo.</span></span>
    </h2>
  </div>

  <div class="servicos__lista" role="radiogroup" aria-label="Serviços" data-servicos>
    <button class="servico" type="button" role="radio" aria-checked="false" data-servico="landing" data-preco="sob consulta">
      <span class="servico__ponto" aria-hidden="true"></span>
      <span class="servico__nome">Landing</span>
      <span class="servico__spec">uma página · animação · rápida no celular</span>
      <span class="servico__preco"><span class="servico__moeda">R$</span><span class="servico__valor">sob consulta</span><span class="servico__mes">/mês</span></span>
    </button>
    <button class="servico" type="button" role="radio" aria-checked="true" data-servico="site" data-preco="sob consulta">
      <span class="servico__ponto" aria-hidden="true"></span>
      <span class="servico__nome">Site</span>
      <span class="servico__spec">institucional · várias páginas · painel de conteúdo</span>
      <span class="servico__preco"><span class="servico__moeda">R$</span><span class="servico__valor">sob consulta</span><span class="servico__mes">/mês</span></span>
    </button>
    <button class="servico" type="button" role="radio" aria-checked="false" data-servico="loja" data-preco="sob consulta">
      <span class="servico__ponto" aria-hidden="true"></span>
      <span class="servico__nome">Loja</span>
      <span class="servico__spec">catálogo · pagamento · frete</span>
      <span class="servico__preco"><span class="servico__moeda">R$</span><span class="servico__valor">sob consulta</span><span class="servico__mes">/mês</span></span>
    </button>
    <button class="servico" type="button" role="radio" aria-checked="false" data-servico="sistema" data-preco="sob consulta">
      <span class="servico__ponto" aria-hidden="true"></span>
      <span class="servico__nome">Sistema</span>
      <span class="servico__spec">painel · API · banco de dados</span>
      <span class="servico__preco"><span class="servico__moeda">R$</span><span class="servico__valor">sob consulta</span><span class="servico__mes">/mês</span></span>
    </button>
  </div>

  <div class="servicos__resumo" data-revela>
    <p class="servicos__frase" aria-live="polite"><span class="servicos__dominio" data-dominio>seunegocio.com.br</span> como <span data-servico-nome>Site</span>, orçamento <span data-servico-preco>sob consulta</span>.</p>
    <a class="botao" href="#contato"><span class="rola" data-texto="Pedir orçamento">Pedir orçamento</span></a>
  </div>
  <p class="servicos__nota" data-revela>Código seu, hospedagem configurada e tudo documentado na entrega.</p>
</section>
